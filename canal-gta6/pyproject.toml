[project]
name = "canal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "Pillow"]  # cenas via ffmpeg scdet (PySceneDetect era lento em 4K)

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["canal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
